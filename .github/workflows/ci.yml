name: Temperature AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Test the Python AI Pipeline
  test-python-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Preprocessing (synthetic data for CI)
        run: python scripts/generate_synthetic_data.py && python src/training/preprocess.py
        
      - name: Train 1D-CNN (Quick 5-epoch test)
        run: python src/training/train_autoencoder.py --epochs 5
        
      - name: Evaluate Model
        run: python src/training/evaluate_model.py
        
      - name: Export ONNX
        run: python src/training/export_onnx.py

  # JOB 2: Build the ESP32 Firmware
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install PlatformIO and esptool
        run: pip install platformio esptool
        
      - name: Build ESP32-C3 Firmware
        run: pio run -d src/inference
        
      - name: Create Merged Binary
        run: |
          BUILD_DIR="src/inference/.pio/build/esp32-c3-devkitm-1"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$BUILD_DIR/"
          esptool --chip esp32c3 merge_bin -o merged_firmware.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BUILD_DIR/boot_app0.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"
            
      - name: Upload Merged Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-merged-firmware
          path: merged_firmware.bin

  # JOB 3: Continuous Delivery (Release on Tag)
  release-firmware:
    needs: [test-python-pipeline, build-firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Merged Firmware Artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-merged-firmware
          path: ./firmware
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./firmware/merged_firmware.bin
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}