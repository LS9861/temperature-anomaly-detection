; =============================================================================
; platformio.ini
; PlatformIO project configuration for ESP32-C3 SuperMini
; =============================================================================

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; --- IMPORTANT FOR ESP32-C3 SUPERMINI ---
; This ensures the USB serial works correctly on the SuperMini
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Libraries for the DS18B20 Sensor
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0