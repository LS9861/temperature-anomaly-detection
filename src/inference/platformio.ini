[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -fno-rtti
    -fno-exceptions
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- Enable TFLM Static Memory Mode ---
    -DTF_LITE_STATIC_MEMORY
    ; --- FlatBuffers & TFLM Third-Party Paths ---
    -Ilib/esp-tflite-micro/third_party/flatbuffers/include
    -Ilib/esp-tflite-micro/third_party/gemmlowp
    -Ilib/esp-tflite-micro/third_party/kissfft
    -Ilib/esp-tflite-micro/third_party/ruy

lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0